<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – KEKS Werkzeugkasten</title>
  <link rel="stylesheet" href="/design.css" />
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ff4f00'/></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand-logo" href="/" aria-label="KEKS Architekten – Startseite">
        <img class="logo-light" src="/assets/keks-logo-black.png" alt="KEKS Architekten" />
        <img class="logo-dark" src="/assets/keks-logo-white.png" alt="KEKS Architekten" />
      </a>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-product">Admin</span>
    </div>
    <div class="topbar-actions">
      <a href="/" class="icon-btn" title="Zurück zur Übersicht" aria-label="Zurück"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
    </div>
  </header>

  <div class="admin-wrap">
    <div id="loading" class="admin-message">Lädt …</div>
    <div id="denied" class="admin-message" hidden>
      <p>Nur für Administratoren · <a href="/">Zur Übersicht</a></p>
    </div>
    <div id="content" hidden>
      <h1>Accounts</h1>
      <p class="admin-hint">Neue Registrierungen erscheinen hier als „wartet“ und müssen freigeschaltet werden, bevor sich der Account einloggen kann.</p>
      <table class="users">
        <thead>
          <tr><th>Benutzername</th><th>Rolle</th><th>Status</th><th>Erstellt</th><th>Aktionen</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>

  <script src="/toolbox-client.js"></script>
  <script>
    const usersBody = document.getElementById('users-body');
    const STATUS_LABEL = { active: 'Aktiv', pending: 'Wartet', disabled: 'Deaktiviert', rejected: 'Abgelehnt' };
    const ROLE_LABEL = { admin: 'Admin', user: 'Nutzer' };

    function fmtDate(iso) {
      if (!iso) return '–';
      return iso.replace('T', ' ').slice(0, 16);
    }

    function actionButtons(user) {
      const btns = [];
      if (user.status !== 'active') btns.push(['Freischalten', 'active']);
      if (user.status === 'pending') btns.push(['Ablehnen', 'rejected']);
      if (user.status === 'active') btns.push(['Deaktivieren', 'disabled']);
      if (user.status === 'disabled' || user.status === 'rejected') btns.push(['Reaktivieren', 'active']);
      return btns;
    }

    async function setStatus(id, status) {
      const res = await fetch(`/api/admin/users/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      if (res.ok) await loadUsers();
      else alert('Aktion fehlgeschlagen');
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      if (res.status === 403) throw new Error('denied');
      const data = await res.json();
      usersBody.innerHTML = '';
      for (const user of data.users) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name"></td>
          <td class="role"></td>
          <td><span class="user-status"></span></td>
          <td class="mono"></td>
          <td><div class="row-actions"></div></td>
        `;
        // textContent statt innerHTML: Benutzernamen kommen aus der Registrierung
        tr.querySelector('.name').textContent = user.username;
        tr.querySelector('.role').textContent = ROLE_LABEL[user.role] || user.role;
        const statusEl = tr.querySelector('.user-status');
        statusEl.classList.add(user.status);
        statusEl.textContent = STATUS_LABEL[user.status] || user.status;
        tr.querySelector('.mono').textContent = fmtDate(user.created_at);
        const actionsCell = tr.querySelector('.row-actions');
        for (const [label, status] of actionButtons(user)) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm';
          btn.textContent = label;
          btn.addEventListener('click', () => setStatus(user.id, status));
          actionsCell.appendChild(btn);
        }
        usersBody.appendChild(tr);
      }
    }

    (async () => {
      const session = await Toolbox.getSession();
      if (!session.loggedIn || session.user.role !== 'admin') {
        document.getElementById('loading').hidden = true;
        document.getElementById('denied').hidden = false;
        return;
      }
      try {
        await loadUsers();
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
      } catch (_) {
        document.getElementById('loading').hidden = true;
        document.getElementById('denied').hidden = false;
      }
    })();
  </script>
</body>
</html>
